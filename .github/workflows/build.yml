name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        id: build
        run: |
          # Internal build number (Android versionCode, release tag "build-N").
          # People see it as "Version N-100" (the run number): 1, 2, 3, ...
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          VERSION=$((BUILD_NUMBER - 100))
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          set -o pipefail
          ./gradlew assembleDebug -PbuildNumber=$BUILD_NUMBER --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as annotations (readable through the GitHub API).
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Verify AC codes are inside the APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SIZE=$(unzip -l "$APK" | awk '$4=="assets/codebook.pcb"{print $1}')
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 100000 ]; then
            echo "::error::assets/codebook.pcb missing or too small in $APK"
            unzip -l "$APK" | grep assets/ || true
            exit 1
          fi
          echo "codebook.pcb: $SIZE bytes"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/PureClimate-Version-${{ steps.build.outputs.version }}.apk"

      - name: Release notes
        run: |
          # Commit message without trailer lines; shown in the app's update popup.
          git log -1 --format=%B | sed -E '/^(Co-Authored-By|Claude-Session|Signed-off-by):/d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > dist/NOTES.md
          cat dist/NOTES.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PureClimate-APK
          path: dist/*.apk
          retention-days: 14

      - name: Publish release (download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.build_number }}
          name: Version ${{ steps.build.outputs.version }}
          body_path: dist/NOTES.md
          files: dist/*.apk
          make_latest: true
