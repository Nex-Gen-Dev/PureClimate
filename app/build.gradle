plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.midea.pureclimate'
    compileSdk 34

    defaultConfig {
        applicationId "com.midea.pureclimate"
        minSdk 24
        targetSdk 34
        // CI passes the run number so every build installs as an update.
        versionCode Integer.parseInt((project.findProperty('buildNumber') ?: '7').toString())
        versionName "2.0." + (project.findProperty('buildNumber') ?: '0')
        vectorDrawables.useSupportLibrary = true
    }

    // One fixed key for every build, so a new APK installs over the previous one
    // instead of failing with "App not installed".
    signingConfigs {
        pureclimate {
            storeFile file('pureclimate-debug.keystore')
            storePassword 'pureclimate'
            keyAlias 'pureclimate'
            keyPassword 'pureclimate'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pureclimate
        }
        release {
            signingConfig signingConfigs.pureclimate
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    aaptOptions {
        // The codebook is already gzipped.
        noCompress 'gz'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
